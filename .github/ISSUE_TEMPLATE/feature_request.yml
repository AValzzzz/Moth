name: Feature request
description: Suggest an idea or improvement for moth
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do that moth can't do well today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen (keybindings, behavior, UI...).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or how nano/vim/micro handle it.
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Editing
        - Search / replace
        - Display / UI
        - File handling
        - Configuration
        - Build / packaging
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this myself
        - label: I searched existing issues and this is not a duplicate
          required: true
