name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/moth-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" moth README.md LICENSE

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
